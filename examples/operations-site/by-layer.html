<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRE Operations - By Layer</title>
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <nav class="site-nav">
    <a href="index.html" class="logo">SRE Ops</a>
    <div class="nav-links">
      <a href="index.html">Overview</a>
      <a href="by-layer.html" class="active">By Layer</a>
      <a href="by-category.html">By Category</a>
      <a href="maturity.html">Maturity</a>
      <a href="metrics.html">Metrics</a>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>
  </nav>

  <div class="page-container">
    <h1 class="page-title">Capabilities by Layer</h1>
    <p class="page-subtitle">Organized by software lifecycle phase</p>

    <div class="stats-grid" id="layer-stats"></div>

    <maturity-grid id="grid" view="by-layer" theme="light" show-legend src="data/capabilities.json"></maturity-grid>
  </div>

  <script type="module" src="assets/prism-ui.js"></script>
  <script>
    async function init() {
      const res = await fetch('data/capabilities.json');
      const caps = await res.json();

      // Calculate per-layer stats
      const layerStats = caps.layers.map(layer => {
        const layerCaps = caps.capabilities.filter(c => c.layerId === layer.id);
        const avgLevel = layerCaps.reduce((sum, c) => {
          const m = caps.maturity[c.id];
          return sum + (m ? m.level : 0);
        }, 0) / layerCaps.length;
        return {
          name: layer.name,
          count: layerCaps.length,
          avgMaturity: avgLevel.toFixed(1)
        };
      });

      document.getElementById('layer-stats').innerHTML = layerStats.map(s => `
        <div class="stat-card">
          <div class="stat-label">${s.name}</div>
          <div class="stat-value">${s.count}</div>
          <div class="stat-subtext">Avg: <span class="maturity-${Math.round(s.avgMaturity)}">M${s.avgMaturity}</span></div>
        </div>
      `).join('');
    }

    function toggleTheme() {
      document.body.classList.toggle('dark');
      const grid = document.getElementById('grid');
      grid.setAttribute('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    }

    init();
  </script>
</body>
</html>
